[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short
markers =
    auth: Authentication and session tests
    job_automation: Job automation workspace and flows
    campaigns: Campaign studio API tests
    day_report: Day-to-day report dashboard tests
    submissions: Submission progress MoM/YoY tests
    linkedin: LinkedIn recruiter discovery tests
    reporting: Pure unit tests for reporting helpers
    notifications: Notification email/SMS setup tests
    playwright: Browser automation tests that require Chromium
